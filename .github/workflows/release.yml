name: Build & Release UWVPN

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uwvpn-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-26
          - arch: x86_64
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Identify native toolchain
        id: toolchain
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          sdk=$(xcrun --show-sdk-version)
          xcode=$(xcodebuild -version | awk '/Build version/ { print $3 }')
          echo "version=$sdk-$xcode" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: src/tun-socks/go.sum

      - name: Cache portable OpenConnect
        uses: actions/cache@v6
        with:
          path: build/helpers-${{ matrix.arch }}/bin/openconnect
          key: openconnect-${{ matrix.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('scripts/build-helpers.sh') }}

      - name: Build and sign app
        env:
          UWVPN_BUILD_OPENSSL: '1'
        run: ./scripts/build-app.sh '${{ matrix.arch }}'

      - name: Test tunnel and validate app
        run: |
          (cd src/tun-socks && CGO_ENABLED=0 go test -mod=readonly ./...)
          /bin/zsh -n src/UWVPN/tun-bridge.sh
          dist/UWVPN.app/Contents/Resources/bin/openconnect --version
          for executable in Contents/MacOS/UWVPN Contents/Resources/bin/{openconnect,tun-socks}; do
            test "$(lipo -archs "dist/UWVPN.app/$executable")" = '${{ matrix.arch }}'
          done

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/UWVPN.app 'dist/UWVPN-macOS-${{ matrix.arch }}.zip'

      - uses: actions/upload-artifact@v7
        with:
          name: UWVPN-macOS-${{ matrix.arch }}
          path: dist/UWVPN-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  universal:
    name: Assemble Universal app
    needs: build
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: UWVPN-macOS-*
          merge-multiple: true
          path: dist

      - name: Assemble and verify Universal app
        run: /bin/zsh scripts/build-universal.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: UWVPN-macOS-universal
          path: dist/UWVPN-macOS-universal.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: universal
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: UWVPN-macOS-*
          merge-multiple: true
          path: dist

      - name: Upload archives to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/UWVPN-macOS-*.zip --clobber
          else
            gh release create "$TAG" dist/UWVPN-macOS-*.zip --verify-tag --generate-notes
          fi
