# Add inside your Mac-only Surge profile (e.g. Eagle-laptop.conf).
# Uses #!REQUIREMENT SYSTEM='macOS' so non-Mac devices ignore these lines.

[Proxy]
#!REQUIREMENT SYSTEM='macOS' UW-VPN = socks5, 127.0.0.1, 11080, udp-relay=true, test-url=https://husky-onnet-test.uw.edu/vpn-test/

[Proxy Group]
#!REQUIREMENT SYSTEM='macOS' UW-Campus = fallback, UW-VPN, DIRECT, interval=60, evaluate-before-use=true
